services:
  class-action-settlements:
    build: .
    image: class-action-settlements
    container_name: class-action-settlements
    restart: unless-stopped
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      SCAN_AT: ${SCAN_AT:-12:00}
      LOOKBACK_DAYS: ${LOOKBACK_DAYS:-0}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/data
